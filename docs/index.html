<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Tech Digest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #f8f9fa;
      --fg: #1e1e2e;
      --muted: #6b7280;
      --border: #d1d5db;
      --card-bg: #ffffff;
      --accent: #ea580c;
      --accent-subtle: #fff7ed;
      --link: #2563eb;
      --link-hover: #1d4ed8;
      --code-bg: #f3f4f6;
      --story-sep: #e5e7eb;
    }

    [data-theme="dark"] {
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #8b949e;
      --border: #30363d;
      --card-bg: #161b22;
      --accent: #f97316;
      --accent-subtle: #1c1400;
      --link: #58a6ff;
      --link-hover: #79c0ff;
      --code-bg: #1c2028;
      --story-sep: #30363d;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.7;
      text-align: left;
      transition: background 0.2s, color 0.2s;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    /* Header bar */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .theme-toggle,
    .lang-toggle,
    .archive-select {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.4rem 0.75rem;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--fg);
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: inherit;
    }

    .theme-toggle {
      font-size: 1.1rem;
    }

    .theme-toggle:hover,
    .lang-toggle:hover,
    .archive-select:hover {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-subtle);
    }

    .archive-select {
      max-width: 9rem;
    }

    /* Digest content rendered from markdown */
    .digest {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2.25rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }

    .digest h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      border-bottom: 2px solid var(--accent);
      padding-bottom: 0.75rem;
      line-height: 1.3;
    }

    .digest h2 {
      font-size: 1.35rem;
      font-weight: 600;
      margin-top: 2rem;
      margin-bottom: 0.5rem;
      line-height: 1.35;
    }

    .digest h3 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-top: 1.5rem;
      margin-bottom: 0.5rem;
      line-height: 1.4;
    }

    .digest blockquote {
      color: var(--muted);
      border-left: 3px solid var(--accent);
      padding-left: 1rem;
      margin: 1rem 0;
      font-style: italic;
    }

    /* Story separator — the horizontal rule between entries */
    .digest hr {
      border: none;
      border-top: 1px solid var(--story-sep);
      margin: 1.75rem 0;
    }

    /* Each story is a <p> group separated by <hr> — give them breathing room */
    .digest p {
      margin: 0.5rem 0;
      line-height: 1.75;
    }

    /* Story numbered rank (first <p> after <hr> or at start) */
    .digest hr + p {
      margin-top: 0;
    }

    .digest a {
      color: var(--link);
      text-decoration: none;
      transition: color 0.15s;
    }

    .digest a:hover {
      color: var(--link-hover);
      text-decoration: underline;
    }

    .digest strong {
      font-weight: 600;
    }

    .digest em {
      color: var(--muted);
      font-style: normal;
    }

    .digest ol, .digest ul {
      padding-left: 1.5rem;
      margin: 0.75rem 0;
    }

    .digest li {
      margin: 0.35rem 0;
      line-height: 1.6;
    }

    .digest code {
      background: var(--code-bg);
      padding: 0.2rem 0.45rem;
      border-radius: 4px;
      font-size: 0.875em;
    }

    /* Source icon + metadata line */
    .digest p:has(> strong:only-child) {
      margin: 0.35rem 0;
    }

    /* Loading / error states */
    .status {
      text-align: center;
      padding: 3.5rem 1rem;
      color: var(--muted);
    }

    .status .icon {
      font-size: 2.25rem;
      margin-bottom: 0.75rem;
    }

    .status.error {
      color: #ef4444;
    }

    /* Footer */
    .footer {
      text-align: center;
      margin-top: 2.25rem;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.6;
    }

    .footer a {
      color: var(--link);
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    /* Mobile */
    @media (max-width: 640px) {
      .container { padding: 1rem 1rem 3rem; }
      .header { flex-wrap: wrap; gap: 0.75rem; }
      .header h1 { font-size: 1.25rem; }
      .digest { padding: 1.25rem; border-radius: 10px; }
      .digest h1 { font-size: 1.4rem; }
      .digest hr { margin: 1.25rem 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 id="siteTitle">🗞️ Daily Tech Digest</h1>
      <div class="controls">
        <select class="archive-select" id="archiveSelect" onchange="onArchiveChange()" aria-label="Choose a date">
          <option value="latest">Latest</option>
        </select>
        <button class="lang-toggle" onclick="toggleLanguage()" id="langToggle" aria-label="Switch language">MY</button>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">🌙</button>
      </div>
    </div>

    <div class="digest" id="content">
      <div class="status">
        <div class="icon">⏳</div>
        <p>Loading latest digest...</p>
      </div>
    </div>

    <div class="footer">
      <p>Built with <a href="https://github.com/MileFisher/daily-tech-digest">daily-tech-digest</a> · Powered by <a href="https://news.ycombinator.com">Hacker News</a> &amp; <a href="https://lobste.rs">Lobsters</a></p>
    </div>
  </div>

  <script>
    // Theme toggle
    function toggleTheme() {
      const body = document.documentElement;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? '' : 'dark');
      localStorage.setItem('theme', isDark ? 'light' : 'dark');
      document.querySelector('.theme-toggle').textContent = isDark ? '🌙' : '☀️';
    }

    // Restore saved theme
    (function() {
      const saved = localStorage.getItem('theme');
      if (saved === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.querySelector('.theme-toggle').textContent = '☀️';
      }
    })();

    // --- language state (content translation only, not UI chrome) ---------
    let currentLang = localStorage.getItem('lang') || 'en';

    function updateLangUI() {
      const btn = document.getElementById('langToggle');
      const title = document.getElementById('siteTitle');
      if (currentLang === 'my') {
        btn.textContent = 'EN';
        title.textContent = '🗞️ နေ့စဉ် နည်းပညာသတင်းများ';
      } else {
        btn.textContent = 'MY';
        title.textContent = '🗞️ Daily Tech Digest';
      }
    }

    function toggleLanguage() {
      currentLang = currentLang === 'my' ? 'en' : 'my';
      localStorage.setItem('lang', currentLang);
      updateLangUI();
      loadDigest();
    }

    // --- archive state -------------------------------------------------------
    let currentDate = 'latest'; // 'latest' or 'YYYY-MM-DD'

    async function loadArchiveList() {
      const select = document.getElementById('archiveSelect');
      try {
        const res = await fetch('archive/index.json');
        if (!res.ok) return; // no archive yet — keep just "Latest"
        const entries = await res.json();
        for (const entry of entries) {
          const opt = document.createElement('option');
          opt.value = entry.date;
          opt.textContent = entry.date;
          select.appendChild(opt);
        }
      } catch {
        // Archive not available yet — "Latest" remains the only option.
      }
    }

    function onArchiveChange() {
      currentDate = document.getElementById('archiveSelect').value;
      loadDigest();
    }

    // --- digest fetch/render ---------------------------------------------------
    function digestPath() {
      const suffix = currentLang === 'my' ? '.my.md' : '.md';
      if (currentDate === 'latest') {
        return `digest-latest${suffix}`;
      }
      return `archive/${currentDate}${suffix}`;
    }

    async function loadDigest() {
      const el = document.getElementById('content');
      el.innerHTML = `<div class="status"><div class="icon">⏳</div><p>Loading...</p></div>`;
      try {
        const res = await fetch(digestPath());
        if (!res.ok) throw new Error(`No digest found (${res.status})`);
        const md = await res.text();
        el.innerHTML = marked.parse(md);
      } catch (err) {
        el.innerHTML = `
          <div class="status error">
            <div class="icon">📭</div>
            <p>${err.message}</p>
            <p style="margin-top:0.5rem;font-size:0.85rem">Run <code>node generate.js</code> to create today's digest.</p>
          </div>
        `;
      }
    }

    updateLangUI();
    loadArchiveList();
    loadDigest();
  </script>
</body>
</html>
